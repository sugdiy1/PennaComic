name: Windows candidate
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: flutter pub get
      - run: dart analyze lib test
      - name: Flutter regression
        shell: pwsh
        run: |
          $env:PENNA_TEST_PYTHON = (Get-Command python).Source
          flutter test --concurrency=2
      - name: Backend regression
        working-directory: backend
        run: python -m unittest discover -p "test_*.py" -q
      - name: Complete Windows build and ZIP
        shell: pwsh
        run: ./tool/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PennaComic-windows-candidate
          path: release/*
